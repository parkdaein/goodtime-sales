<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>굿타임 영업백서 - 3일간의 기적</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f4f6f9;
      --panel-bg: #ffffff;
      --border-color: #1e293b;
      --primary: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --accent: #8b5cf6;
      --shadow: 4px 4px 0px #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', sans-serif;
      user-select: none;
    }

    body {
      background-color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      transition: background-color 0.4s;
    }

    body.overtime-bg {
      background-color: #31102f;
    }

    #game-container {
      width: 100%;
      max-width: 880px;
      background: var(--panel-bg);
      border: 3px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 8px 8px 0px var(--border-color);
      overflow: hidden;
      position: relative;
    }

    #fx-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 50;
    }

    .money-particle {
      position: absolute;
      top: -40px;
      font-size: 1.8rem;
      animation: fallDown 1.4s ease-in forwards;
    }

    @keyframes fallDown {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(620px) rotate(360deg); opacity: 0; }
    }

    .contract-stamp {
      position: absolute;
      top: 18px;
      right: 22px;
      border: 4px solid #dc2626;
      color: #dc2626;
      font-family: 'Jua', sans-serif;
      font-size: 1.5rem;
      padding: 6px 14px;
      border-radius: 10px;
      transform: rotate(-12deg) scale(2.5);
      opacity: 0;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 2px 2px 0px rgba(220, 38, 38, 0.3);
      animation: stampSlam 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      pointer-events: none;
      z-index: 20;
    }

    .contract-stamp.gold {
      border-color: #d97706;
      color: #b45309;
      background: #fef08a;
    }

    @keyframes stampSlam {
      0% { transform: rotate(-12deg) scale(2.8); opacity: 0; }
      100% { transform: rotate(-12deg) scale(1); opacity: 1; }
    }

    #status-bar {
      display: none;
      background: #1e293b;
      color: #fff;
      padding: 10px 16px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-weight: 700;
    }

    #status-bar.overtime-bar {
      background: linear-gradient(90deg, #7f1d1d, #991b1b, #7f1d1d);
      border-bottom: 3px solid #fde047;
    }

    .stat-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .stat-badge {
      background: rgba(15, 23, 42, 0.65);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.84rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-money { color: #fde047; }
    .stat-mental { color: #fda4af; }
    .stat-speech { color: #93c5fd; }
    .stat-streak { color: #6ee7b7; }

    .top-btn-group {
      display: flex;
      gap: 6px;
    }

    .btn-mini {
      border: 2px solid #0f172a;
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      background: #fde047;
      color: #1e293b;
      transition: transform 0.1s;
    }

    .btn-mini:active { transform: translateY(1px); }
    .btn-mini-danger { background: #fca5a5; color: #7f1d1d; }

    .screen {
      display: none;
      padding: 26px;
      min-height: 560px;
      flex-direction: column;
      justify-content: space-between;
    }
    .screen.active { display: flex; }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .webtoon-title {
      font-family: 'Jua', sans-serif;
      font-size: 2.5rem;
      color: #1e293b;
      text-shadow: 2px 2px 0px #fde047;
    }

    .subtitle {
      color: #475569;
      font-size: 1rem;
      margin-bottom: 18px;
      font-weight: 600;
    }

    .id-card-box {
      border: 3px solid var(--border-color);
      border-radius: 16px;
      background: #f8fafc;
      padding: 24px;
      max-width: 480px;
      width: 100%;
      margin: 10px auto;
      box-shadow: 6px 6px 0px var(--border-color);
      text-align: center;
    }

    .id-card-header {
      background: #1e293b;
      color: #fde047;
      font-family: 'Jua', sans-serif;
      font-size: 1.2rem;
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    .id-input {
      width: 100%;
      padding: 14px 16px;
      border: 3px solid var(--border-color);
      border-radius: 10px;
      font-size: 1.15rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 14px;
      background: #fff;
    }

    .id-input:focus {
      outline: none;
      background: #fefce8;
    }

    .mission-banner {
      background: #fef2f2;
      border: 2.5px solid #ef4444;
      color: #b91c1c;
      padding: 12px 16px;
      border-radius: 10px;
      text-align: center;
      font-weight: 800;
      font-size: 0.98rem;
      margin-bottom: 18px;
      box-shadow: 3px 3px 0px #ef4444;
      line-height: 1.45;
    }

    .overtime-banner {
      background: linear-gradient(90deg, #dc2626, #991b1b);
      color: #fde047;
      border: 2.5px solid #1e293b;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 12px;
      animation: pulseBanner 1s infinite alternate;
    }

    @keyframes pulseBanner {
      from { transform: scale(1); }
      to { transform: scale(1.015); }
    }

    .char-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 16px;
    }

    @media (max-width: 680px) {
      .char-grid { grid-template-columns: 1fr; }
    }

    .char-card {
      border: 3px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      background: #fff;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .char-card:hover {
      transform: translateY(-4px);
      background: #fefce8;
    }

    .char-avatar {
      font-size: 3rem;
      text-align: center;
      background: #f1f5f9;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 0;
      margin-bottom: 10px;
    }

    .char-name {
      font-family: 'Jua', sans-serif;
      font-size: 1.35rem;
      margin-bottom: 4px;
    }

    .char-tag {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      background: #e2e8f0;
      margin-bottom: 8px;
    }

    .char-stats {
      font-size: 0.84rem;
      line-height: 1.55;
      margin-bottom: 8px;
      color: #334155;
    }

    .char-passive {
      font-size: 0.79rem;
      background: #f8fafc;
      border: 1.5px dashed #94a3b8;
      padding: 8px;
      border-radius: 8px;
      color: #1e293b;
      line-height: 1.45;
    }

    .webtoon-panel {
      border: 3px solid var(--border-color);
      border-radius: 12px;
      background: #f8fafc;
      padding: 20px;
      position: relative;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .portrait-box {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 14px;
    }

    .portrait-icon {
      width: 72px;
      height: 72px;
      border: 3px solid var(--border-color);
      border-radius: 12px;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.6rem;
      flex-shrink: 0;
    }

    .speaker-name {
      font-family: 'Jua', sans-serif;
      font-size: 1.3rem;
      color: #1e293b;
    }

    .speaker-role {
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 600;
    }

    .speech-bubble {
      background: #fff;
      border: 2.5px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      font-size: 1.05rem;
      line-height: 1.65;
      min-height: 120px;
      position: relative;
      font-weight: 500;
      white-space: pre-line;
      cursor: pointer;
    }

    .dragon-alert {
      margin-top: 12px;
      background: #fef2f2;
      border: 2.5px solid #dc2626;
      border-radius: 10px;
      padding: 12
